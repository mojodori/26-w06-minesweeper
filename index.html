<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f4">
  <title>지뢰찾기</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      color: #20312d;
      background: #f3f6f4;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --cell-size: min(9vw, 48px);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(ellipse at 50% 0%, #e4eee8 0, transparent 55%),
        #f3f6f4;
    }

    main {
      width: min(100%, 480px);
      padding: clamp(20px, 5vw, 34px);
      border: 1px solid #e1e9e4;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 50px #244b3812;
    }

    .heading { text-align: center; }

    .eyebrow {
      margin: 0 0 8px;
      color: #54806a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 36px);
      letter-spacing: -.06em;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: #75827c;
      font-size: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 14px;
      background: #f3f7f4;
    }

    .counter {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .counter:last-child { text-align: right; }

    .counter-label {
      color: #78857f;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .counter-value {
      color: #294638;
      font-variant-numeric: tabular-nums;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
    }

    #reset {
      width: 44px;
      height: 44px;
      border: 1px solid #dce8df;
      border-radius: 13px;
      background: #fff;
      cursor: pointer;
      font-size: 23px;
      transition: transform .15s, background .15s;
    }

    #reset:hover { transform: translateY(-2px); background: #fafffb; }
    #reset:active { transform: scale(.94); }

    #board {
      display: grid;
      grid-template-columns: repeat(9, var(--cell-size));
      grid-template-rows: repeat(9, var(--cell-size));
      gap: 4px;
      justify-content: center;
      padding: 10px;
      border-radius: 16px;
      background: #e8efea;
      touch-action: manipulation;
      user-select: none;
    }

    .cell {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 2px 0 #d5e2d9;
      color: #294638;
      cursor: pointer;
      font-family: inherit;
      font-size: clamp(15px, 4vw, 20px);
      font-weight: 900;
      line-height: 1;
      transition: background .12s, transform .12s, box-shadow .12s;
    }

    .cell:not(.revealed):hover { background: #f7fff9; transform: translateY(-1px); }
    .cell:not(.revealed):active { transform: translateY(1px); box-shadow: none; }
    .cell.revealed { background: #dce8df; box-shadow: none; cursor: default; }
    .cell.flagged { background: #fff8e8; }
    .cell.mine-hit { background: #f6b8a9; }
    .cell.wrong-flag { background: #f7ddd7; }
    .cell[data-number="1"] { color: #3676c5; }
    .cell[data-number="2"] { color: #318451; }
    .cell[data-number="3"] { color: #d45b4e; }
    .cell[data-number="4"] { color: #6451ac; }
    .cell[data-number="5"] { color: #a34e34; }
    .cell[data-number="6"] { color: #278d91; }
    .cell[data-number="7"] { color: #38423e; }
    .cell[data-number="8"] { color: #7a8580; }

    #status {
      min-height: 24px;
      margin: 15px 0 5px;
      color: #586760;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }
    #status[data-state="won"] { color: #278451; }
    #status[data-state="lost"] { color: #c34d3d; }

    .instructions {
      margin: 0;
      color: #89948e;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      :root { --cell-size: min(8.8vw, 38px); }
      #board { gap: 3px; padding: 8px; }
      .cell { border-radius: 5px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="heading">
      <p class="eyebrow">Classic puzzle</p>
      <h1>지뢰찾기</h1>
      <p class="subtitle">숨겨진 지뢰를 피해 모든 안전한 칸을 열어보세요.</p>
    </header>

    <section class="toolbar" aria-label="게임 정보">
      <div class="counter">
        <span class="counter-label">남은 지뢰</span>
        <span class="counter-value" id="mine-count" aria-live="polite">10</span>
      </div>
      <button id="reset" type="button" aria-label="새 게임" title="새 게임">🙂</button>
      <div class="counter">
        <span class="counter-label">시간</span>
        <span class="counter-value" id="timer" aria-live="off">000</span>
      </div>
    </section>

    <div id="board" role="grid" aria-label="9행 9열 지뢰찾기 게임판"></div>
    <p id="status" role="status" aria-live="polite">칸을 열어 게임을 시작하세요.</p>
    <p class="instructions">좌클릭: 칸 열기 <span aria-hidden="true">·</span> 우클릭: 깃발 표시</p>
  </main>

  <script>
    (() => {
      "use strict";

      const SIZE = 9;
      const MINE_TOTAL = 10;
      const boardElement = document.querySelector("#board");
      const mineCountElement = document.querySelector("#mine-count");
      const timerElement = document.querySelector("#timer");
      const statusElement = document.querySelector("#status");
      const resetButton = document.querySelector("#reset");

      let cells = [];
      let started = false;
      let gameOver = false;
      let flags = 0;
      let seconds = 0;
      let timerId = null;

      function neighborsOf(index) {
        const row = Math.floor(index / SIZE);
        const column = index % SIZE;
        const neighbors = [];

        for (let rowOffset = -1; rowOffset <= 1; rowOffset += 1) {
          for (let columnOffset = -1; columnOffset <= 1; columnOffset += 1) {
            if (rowOffset === 0 && columnOffset === 0) continue;
            const nextRow = row + rowOffset;
            const nextColumn = column + columnOffset;
            if (nextRow >= 0 && nextRow < SIZE && nextColumn >= 0 && nextColumn < SIZE) {
              neighbors.push(nextRow * SIZE + nextColumn);
            }
          }
        }

        return neighbors;
      }

      function startTimer() {
        if (started) return;
        started = true;
        timerId = window.setInterval(() => {
          seconds += 1;
          timerElement.textContent = String(seconds).padStart(3, "0");
        }, 1000);
      }

      function updateMineCount() {
        mineCountElement.textContent = String(MINE_TOTAL - flags).padStart(2, "0");
      }

      function renderCell(index) {
        const cell = cells[index];
        const element = cell.element;

        element.classList.toggle("revealed", cell.revealed);
        element.classList.toggle("flagged", cell.flagged && !cell.revealed);
        element.classList.toggle("mine-hit", cell.hit);
        element.classList.toggle("wrong-flag", cell.wrongFlag);
        element.removeAttribute("data-number");

        if (cell.wrongFlag) {
          element.textContent = "✕";
          element.setAttribute("aria-label", `행 ${Math.floor(index / SIZE) + 1}, 열 ${index % SIZE + 1}: 잘못된 깃발`);
        } else if (cell.flagged && !cell.revealed) {
          element.textContent = "🚩";
          element.setAttribute("aria-label", `행 ${Math.floor(index / SIZE) + 1}, 열 ${index % SIZE + 1}: 깃발`);
        } else if (cell.revealed && cell.mine) {
          element.textContent = "💣";
          element.setAttribute("aria-label", `행 ${Math.floor(index / SIZE) + 1}, 열 ${index % SIZE + 1}: 지뢰`);
        } else if (cell.revealed && cell.neighborMines > 0) {
          element.textContent = String(cell.neighborMines);
          element.dataset.number = String(cell.neighborMines);
          element.setAttribute("aria-label", `행 ${Math.floor(index / SIZE) + 1}, 열 ${index % SIZE + 1}: 주변 지뢰 ${cell.neighborMines}개`);
        } else {
          element.textContent = "";
          element.setAttribute("aria-label", `행 ${Math.floor(index / SIZE) + 1}, 열 ${index % SIZE + 1}${cell.revealed ? ": 빈 칸" : ": 닫힌 칸"}`);
        }
      }

      function placeMines(firstIndex) {
        const available = cells
          .map((_, index) => index)
          .filter((index) => index !== firstIndex);

        for (let index = available.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [available[index], available[randomIndex]] = [available[randomIndex], available[index]];
        }

        available.slice(0, MINE_TOTAL).forEach((index) => {
          cells[index].mine = true;
        });

        cells.forEach((cell, index) => {
          cell.neighborMines = neighborsOf(index).filter((neighbor) => cells[neighbor].mine).length;
        });
      }

      function finish(won) {
        gameOver = true;
        window.clearInterval(timerId);
        resetButton.textContent = won ? "😎" : "😵";
        resetButton.setAttribute("aria-label", won ? "새 게임 (승리)" : "새 게임 (게임 종료)");
        statusElement.dataset.state = won ? "won" : "lost";
        statusElement.textContent = won
          ? `축하합니다! ${seconds}초 만에 모든 안전한 칸을 열었습니다.`
          : "지뢰를 밟았습니다. 새 게임으로 다시 도전하세요.";

        cells.forEach((cell, index) => {
          if (cell.mine && !cell.flagged) cell.revealed = true;
          if (!cell.mine && cell.flagged) cell.wrongFlag = true;
          renderCell(index);
        });
      }

      function checkWin() {
        if (cells.every((cell) => cell.mine || cell.revealed)) finish(true);
      }

      function reveal(index) {
        if (gameOver || cells[index].revealed || cells[index].flagged) return;
        startTimer();

        if (!started || !cells.some((cell) => cell.mine)) placeMines(index);

        const firstReveal = cells.every((cell) => !cell.revealed);
        if (firstReveal && cells[index].mine) placeMines(index);

        const queue = [index];
        while (queue.length > 0) {
          const currentIndex = queue.shift();
          const current = cells[currentIndex];
          if (current.revealed || current.flagged) continue;
          current.revealed = true;
          renderCell(currentIndex);

          if (current.neighborMines === 0 && !current.mine) {
            neighborsOf(currentIndex).forEach((neighbor) => {
              if (!cells[neighbor].revealed && !cells[neighbor].flagged) queue.push(neighbor);
            });
          }
        }

        if (cells[index].mine) {
          cells[index].hit = true;
          finish(false);
          return;
        }

        checkWin();
      }

      function toggleFlag(index) {
        if (gameOver || cells[index].revealed) return;
        startTimer();
        cells[index].flagged = !cells[index].flagged;
        flags += cells[index].flagged ? 1 : -1;
        updateMineCount();
        renderCell(index);
      }

      function newGame() {
        window.clearInterval(timerId);
        cells = Array.from({ length: SIZE * SIZE }, () => ({
          mine: false,
          neighborMines: 0,
          revealed: false,
          flagged: false,
          hit: false,
          wrongFlag: false,
          element: null
        }));
        started = false;
        gameOver = false;
        flags = 0;
        seconds = 0;
        timerId = null;
        timerElement.textContent = "000";
        resetButton.textContent = "🙂";
        resetButton.setAttribute("aria-label", "새 게임");
        statusElement.textContent = "칸을 열어 게임을 시작하세요.";
        delete statusElement.dataset.state;

        const fragment = document.createDocumentFragment();
        cells.forEach((cell, index) => {
          const button = document.createElement("button");
          button.className = "cell";
          button.type = "button";
          button.setAttribute("role", "gridcell");
          button.setAttribute("aria-label", `행 ${Math.floor(index / SIZE) + 1}, 열 ${index % SIZE + 1}: 닫힌 칸`);
          button.addEventListener("click", () => reveal(index));
          button.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            toggleFlag(index);
          });
          cell.element = button;
          fragment.append(button);
        });
        boardElement.replaceChildren(fragment);
        updateMineCount();
      }

      resetButton.addEventListener("click", newGame);
      newGame();
    })();
  </script>
</body>
</html>
