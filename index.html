<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef3ef">
  <title>지뢰찾기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="heading">
      <p class="eyebrow">Classic puzzle</p>
      <h1>지뢰찾기</h1>
      <p class="subtitle">숨겨진 지뢰를 피해 모든 안전한 칸을 열어보세요.</p>
    </header>

    <section class="toolbar" aria-label="게임 정보">
      <div class="counter">
        <span class="counter-label">남은 지뢰</span>
        <span class="counter-value" id="mine-count" aria-live="polite">10</span>
      </div>
      <button id="reset" type="button" aria-label="새 게임" title="새 게임">🙂</button>
      <div class="counter">
        <span class="counter-label">시간</span>
        <span class="counter-value" id="timer" aria-live="off">000</span>
      </div>
    </section>

    <div class="game-options">
      <div class="settings">
        <span class="settings-label">난이도</span>
        <div class="difficulty-buttons" role="group" aria-label="난이도 선택">
          <button class="difficulty-button is-selected" type="button" data-difficulty="beginner" aria-label="초급, 9×9, 지뢰 10개" aria-pressed="true">초급</button>
          <button class="difficulty-button" type="button" data-difficulty="intermediate" aria-label="중급, 16×16, 지뢰 40개" aria-pressed="false">중급</button>
          <button class="difficulty-button" type="button" data-difficulty="expert" aria-label="고급, 30×16, 지뢰 99개" aria-pressed="false">고급</button>
        </div>
      </div>
      <p class="best-record">이 난이도 최고 기록<strong id="best-record">--</strong></p>
    </div>

    <div class="board-scroll">
      <div id="board" role="grid" aria-label="9행 9열 지뢰찾기 게임판"></div>
    </div>
    <p id="status" role="status" aria-live="polite">칸을 열어 게임을 시작하세요.</p>
    <p class="instructions">좌클릭: 칸 열기 <span aria-hidden="true">·</span> 우클릭: 깃발 표시 <span aria-hidden="true">·</span> 열린 숫자 칸 클릭: 주변 칸 열기</p>
  </main>
  <div id="confetti" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
